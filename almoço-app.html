<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoço - Apis Flora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0A3922 0%, #119C57 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: #0A3922;
            padding: 30px 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            color: white;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header-date {
            font-size: 13px;
            color: #119C57;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #119C57;
            color: white;
        }

        .btn-primary:hover {
            background: #0D7A45;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(17, 156, 87, 0.4);
        }

        .btn-copy {
            background: #119C57;
            color: white;
        }

        .btn-copy:hover {
            background: #0D7A45;
        }

        .btn-secondary {
            background: #6C8C84;
            color: white;
        }

        .btn-secondary:hover {
            background: #556B63;
        }

        .btn-edit {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            font-size: 11px;
        }

        .btn-edit:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #B10B01;
            color: white;
            padding: 6px 12px;
            font-size: 11px;
        }

        .btn-danger:hover {
            background: #8A0800;
        }

        .alerts {
            padding: 0 25px;
            padding-top: 15px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            animation: slideIn 0.3s ease;
            margin-bottom: 10px;
        }

        .alert-success {
            background: #E8F3EE;
            color: #0A3922;
            border-left: 4px solid #119C57;
        }

        .alert-error {
            background: #FDE8E6;
            color: #B10B01;
            border-left: 4px solid #B10B01;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .content {
            padding: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
        }

        thead {
            background: #0A3922;
        }

        th {
            color: white;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        th:nth-child(1) {
            width: 40px;
            text-align: center;
        }

        th:nth-child(2) {
            flex: 1;
        }

        th:nth-child(3) {
            width: 60px;
            text-align: center;
        }

        th:nth-child(4) {
            flex: 1;
        }

        th:nth-child(5) {
            width: 130px;
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #e8e8e8;
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 13px 12px;
            font-size: 13px;
            color: #333;
        }

        td:nth-child(1) {
            text-align: center;
        }

        td:nth-child(3) {
            text-align: center;
            font-weight: 500;
        }

        td:nth-child(5) {
            text-align: center;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #119C57;
        }

        .btn-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        tfoot tr {
            background: #E8F3EE;
            font-weight: 600;
        }

        tfoot td {
            padding: 15px 12px;
            border: none;
            font-size: 13px;
        }

        tfoot td:nth-child(1) {
            width: 40px;
        }

        tfoot td:nth-child(3) {
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
            font-size: 14px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #0A3922;
            border-bottom: 2px solid #119C57;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            transition: border 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #119C57;
            box-shadow: 0 0 0 3px rgba(17, 156, 87, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            justify-content: flex-end;
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .image-container {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .image-instructions {
            padding: 15px;
            background: #E8F3EE;
            border-radius: 8px;
            font-size: 13px;
            color: #0A3922;
            margin-bottom: 20px;
            border-left: 4px solid #119C57;
        }

        .image-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .close-image {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #B10B01;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .close-image:hover {
            background: #8A0800;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #119C57;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 15px;
            }

            .container {
                border-radius: 12px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 8px;
            }

            .button-group {
                gap: 8px;
            }

            button {
                padding: 8px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Almoço - Apis Flora</h1>
            <div class="header-date" id="current-date"></div>
            <div class="button-group">
                <button class="btn-primary" onclick="openAddModal()">+ Adicionar</button>
                <button class="btn-copy" onclick="captureAndCopy()">📋 Copiar</button>
                <button class="btn-secondary" onclick="syncData()">🔄 Sincronizar</button>
            </div>
        </div>

        <div class="alerts" id="alerts"></div>

        <div class="content">
            <table id="lunch-table">
                <thead>
                    <tr>
                        <th>☑</th>
                        <th>Pessoa</th>
                        <th>QTD</th>
                        <th>Observação</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="5" class="empty-state">Carregando dados...</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td></td>
                        <td>Total de Marmitas</td>
                        <td><span id="total-marmitas">0</span></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Tabela oculta para captura -->
    <table id="capture-table" style="border-collapse: collapse; width: 100%; font-family: 'Montserrat', sans-serif; background: white; display: none;">
        <tr style="background: #0A3922;">
            <th style="color: white; padding: 15px; text-align: left; font-weight: 700; border: none;">🍽️ Almoço - Apis Flora</th>
            <th id="capture-date-header" style="color: #119C57; text-align: right; padding: 15px; font-weight: 500; font-size: 12px; border: none;"></th>
        </tr>
        <tr style="background: #0A3922;">
            <th style="color: white; padding: 15px; text-align: left; font-weight: 700; border: none;">Pessoa</th>
            <th style="color: white; padding: 15px; text-align: center; font-weight: 700; border: none;">QTD</th>
            <th style="color: white; padding: 15px; text-align: left; font-weight: 700; border: none;">Observação</th>
        </tr>
        <tbody id="capture-tbody"></tbody>
        <tr style="background: #E8F3EE; font-weight: 700;">
            <td style="padding: 15px; border: none;">Total de Marmitas</td>
            <td id="capture-total" style="text-align: center; font-size: 18px; padding: 15px; border: none;">0</td>
            <td style="border: none;"></td>
        </tr>
    </table>

    <!-- Modal para imagem -->
    <div class="image-modal" id="imageModal">
        <div class="image-container">
            <button class="close-image" onclick="closeImageModal()">✕</button>
            <img id="capturedImage" src="" alt="Imagem capturada">
            <div class="image-instructions">
                <strong>📋 Como copiar:</strong><br>
                Clique com botão direito na imagem → "Copiar Imagem" → Cole no WhatsApp
            </div>
            <div class="image-buttons">
                <button class="btn-copy" onclick="downloadImage()">⬇️ Baixar</button>
                <button class="btn-secondary" onclick="closeImageModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal para adicionar/editar -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header" id="modal-title">Adicionar Pessoa</div>
            <form onsubmit="savePerson(event)">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="modal-name" required>
                </div>
                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="modal-quantity" value="1" min="1" required>
                </div>
                <div class="form-group">
                    <label>Observação</label>
                    <input type="text" id="modal-notes" placeholder="Ex: Sem feijão, Sem arroz...">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eccrsrkseulutbnnlojh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Nw-BwBCYy3hpq6Sz-lnCIQ_h6zL_1rl';

        let supabaseClient = null;
        let currentData = [];
        let isInitialized = false;
        let editingIndex = null;
        let selectedForCapture = new Set();
        let lastCaptureDataUrl = null;

        async function initSupabase() {
            if (!SUPABASE_URL.includes('seu-projeto')) {
                try {
                    const { createClient } = window.supabase;
                    supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
                    isInitialized = true;
                    await loadData();
                } catch (error) {
                    showAlert('Erro ao conectar com Supabase', 'error');
                    loadDataFromLocalStorage();
                }
            } else {
                showAlert('Configure o Supabase primeiro', 'error');
                loadDataFromLocalStorage();
            }
        }

        async function loadData() {
            try {
                if (!supabaseClient) return;
                const today = new Date().toISOString().split('T')[0];
                const { data, error } = await supabaseClient.from('almocos').select('*').eq('data', today);
                if (error) throw error;
                currentData = data || [];
                selectedForCapture.clear();
                currentData.forEach((_, index) => selectedForCapture.add(index));
                renderTable();
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                loadDataFromLocalStorage();
            }
        }

        function loadDataFromLocalStorage() {
            const today = new Date().toISOString().split('T')[0];
            const stored = localStorage.getItem(`almocos-${today}`);
            currentData = stored ? JSON.parse(stored) : [];
            selectedForCapture.clear();
            currentData.forEach((_, index) => selectedForCapture.add(index));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            if (currentData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhum almoço cadastrado. Clique em "+ Adicionar".</td></tr>';
                document.getElementById('total-marmitas').textContent = '0';
                return;
            }

            tbody.innerHTML = currentData.map((item, index) => `
                <tr>
                    <td><input type="checkbox" ${selectedForCapture.has(index) ? 'checked' : ''} onchange="toggleSelection(${index}, this.checked)"></td>
                    <td>${item.nome}</td>
                    <td>${item.quantidade || 1}</td>
                    <td>${item.particularidades || ''}</td>
                    <td>
                        <div class="btn-actions">
                            <button class="btn-edit" onclick="editPerson(${index})">Editar</button>
                            <button class="btn-danger" onclick="deletePerson(${index})">Remover</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            const total = currentData.reduce((sum, item) => sum + (item.quantidade || 1), 0);
            document.getElementById('total-marmitas').textContent = total;
        }

        function toggleSelection(index, checked) {
            if (checked) selectedForCapture.add(index);
            else selectedForCapture.delete(index);
            renderTable();
        }

        function editPerson(index) {
            editingIndex = index;
            const person = currentData[index];
            document.getElementById('modal-title').textContent = 'Editar Pessoa';
            document.getElementById('modal-name').value = person.nome;
            document.getElementById('modal-quantity').value = person.quantidade || 1;
            document.getElementById('modal-notes').value = person.particularidades || '';
            openAddModal();
        }

        async function savePerson(event) {
            event.preventDefault();
            const name = document.getElementById('modal-name').value;
            const quantity = parseInt(document.getElementById('modal-quantity').value) || 1;
            const notes = document.getElementById('modal-notes').value;
            const person = { nome: name, quantidade: quantity, particularidades: notes, data: new Date().toISOString().split('T')[0] };

            if (editingIndex !== null) {
                currentData[editingIndex] = person;
                if (supabaseClient && isInitialized) {
                    try {
                        const today = new Date().toISOString().split('T')[0];
                        await supabaseClient.from('almocos').delete().eq('data', today);
                        await supabaseClient.from('almocos').insert(currentData);
                        showAlert('Pessoa atualizada!', 'success');
                    } catch (error) {
                        saveToLocalStorage();
                        showAlert('Atualizado localmente', 'success');
                    }
                } else saveToLocalStorage();
                editingIndex = null;
            } else {
                if (supabaseClient && isInitialized) {
                    try {
                        await supabaseClient.from('almocos').insert([person]);
                        showAlert('Pessoa adicionada!', 'success');
                    } catch (error) {
                        saveToLocalStorage();
                        showAlert('Salvo localmente', 'success');
                    }
                } else {
                    saveToLocalStorage();
                    showAlert('Pessoa adicionada!', 'success');
                }
                currentData.push(person);
                selectedForCapture.add(currentData.length - 1);
            }
            renderTable();
            closeAddModal();
        }

        function saveToLocalStorage() {
            const today = new Date().toISOString().split('T')[0];
            localStorage.setItem(`almocos-${today}`, JSON.stringify(currentData));
        }

        async function deletePerson(index) {
            if (!confirm('Tem certeza que deseja remover?')) return;
            currentData.splice(index, 1);
            selectedForCapture.delete(index);
            const newSelected = new Set();
            selectedForCapture.forEach(i => {
                if (i > index) newSelected.add(i - 1);
                else if (i < index) newSelected.add(i);
            });
            selectedForCapture = newSelected;

            if (supabaseClient && isInitialized) {
                try {
                    const today = new Date().toISOString().split('T')[0];
                    await supabaseClient.from('almocos').delete().eq('data', today);
                    if (currentData.length > 0) await supabaseClient.from('almocos').insert(currentData);
                } catch (error) {
                    console.error('Erro ao deletar:', error);
                }
            }
            const today = new Date().toISOString().split('T')[0];
            localStorage.setItem(`almocos-${today}`, JSON.stringify(currentData));
            renderTable();
        }

        async function captureAndCopy() {
            if (selectedForCapture.size === 0) {
                showAlert('Selecione ao menos uma pessoa!', 'error');
                return;
            }

            const btn = document.querySelector('.btn-copy');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Gerando...';

            try {
                const tbody = document.getElementById('capture-tbody');
                tbody.innerHTML = '';
                let totalQty = 0;
                selectedForCapture.forEach(index => {
                    const item = currentData[index];
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid #eee';
                    row.innerHTML = `
                        <td style="padding: 12px 15px; border: none;">${item.nome}</td>
                        <td style="padding: 12px 15px; text-align: center; border: none;">${item.quantidade || 1}</td>
                        <td style="padding: 12px 15px; border: none;">${item.particularidades || ''}</td>
                    `;
                    tbody.appendChild(row);
                    totalQty += (item.quantidade || 1);
                });

                document.getElementById('capture-date-header').textContent = document.getElementById('current-date').textContent;
                document.getElementById('capture-total').textContent = totalQty;

                const table = document.getElementById('capture-table');
                table.style.display = 'table';
                const canvas = await html2canvas(table, { backgroundColor: '#ffffff', scale: 2, logging: false });
                table.style.display = 'none';
                lastCaptureDataUrl = canvas.toDataURL('image/png');
                document.getElementById('capturedImage').src = lastCaptureDataUrl;
                document.getElementById('imageModal').classList.add('active');
                showAlert('✅ Imagem pronta!', 'success');
            } catch (error) {
                showAlert('Erro ao capturar imagem', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function downloadImage() {
            if (!lastCaptureDataUrl) {
                showAlert('Nenhuma imagem', 'error');
                return;
            }
            const link = document.createElement('a');
            link.href = lastCaptureDataUrl;
            link.download = `almoço-${new Date().toISOString().split('T')[0]}.png`;
            link.click();
            showAlert('📥 Baixado!', 'success');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') closeImageModal();
        });

        async function syncData() {
            if (!supabaseClient || !isInitialized) {
                showAlert('Supabase não configurado', 'error');
                return;
            }
            try {
                await loadData();
                showAlert('Sincronizado!', 'success');
            } catch (error) {
                showAlert('Erro ao sincronizar', 'error');
            }
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('modal-name').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('modal-title').textContent = 'Adicionar Pessoa';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-quantity').value = '1';
            document.getElementById('modal-notes').value = '';
            editingIndex = null;
        }

        function showAlert(message, type = 'success') {
            const alerts = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alerts.appendChild(alert);
            setTimeout(() => alert.remove(), 4000);
        }

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString('pt-BR', options);
            document.getElementById('current-date').textContent = today;
        }

        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target.id === 'addModal') closeAddModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            initSupabase();
        });
    </script>
</body>
</html>
